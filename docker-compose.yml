# GeneGenius portal on :7000 and SonarQube on :7010/sonar.    docker compose up -d --build
# Optional parts are profiles, switched on with COMPOSE_PROFILES in .env (install.sh sets it):
#   https - Caddy serves https://DOMAIN and https://DOMAIN/sonar with an automatic certificate
#   llm   - a local coder model (Ollama) the portal uses for reviews and the chatbot
name: gg-portal
services:
  portal:
    build: .   # install.sh makes sure containers (and so build steps) can resolve names first
    env_file: .env
    environment:
      SONAR_URL: http://sonarqube:9000/sonar
      GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
    volumes:
      - portal_data:/data
      - ./secrets:/secrets:ro
    ports: ["${BIND_ADDR:-0.0.0.0}:7000:7000"]
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
      SONAR_WEB_CONTEXT: /sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ports: ["${BIND_ADDR:-0.0.0.0}:7010:9000"]
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192
    depends_on: [sonar-db]
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes: [sonar_db:/var/lib/postgresql/data]
    restart: unless-stopped

  # Optional local model (profile "llm"): OpenAI-compatible API at http://llm:11434/v1, reachable only by the portal.
  llm:
    image: ollama/ollama:0.35.1
    profiles: [llm]
    environment:
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT:-16384}
      OLLAMA_KEEP_ALIVE: 24h        # keep the model in RAM between requests
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: ["${OLLAMA_DIR:-ollama}:/root/.ollama"]   # OLLAMA_DIR: a host Ollama's store, reused (install.sh)
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [portal, sonarqube]
    restart: unless-stopped

volumes:
  portal_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db:
  caddy_data:
  ollama:
