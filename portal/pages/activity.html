<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity</title><link rel="stylesheet" href="/static/style.css"></head>
<body><nav></nav>
<h1>Activity</h1>
<p class="muted">Who pushed what, what CI said about it, and which pushes broke a check that was passing before.</p>
<form class="filters" id="f">
  <select name="repo"><option value="">All repos</option></select>
  <select name="days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
  <input name="person" placeholder="GitHub login or email" size="22">
  <button>Filter</button>
</form>
<div id="breaks"></div>
<h2>Pushes</h2><div id="pushes" class="muted">Loading...</div>
<h2>Commits</h2><div id="commits"></div>
<script type="module">
import {api, nav, h, when, short, repoName, commitLink, checkChips, table} from "/static/app.js";
nav("/activity");
const form = document.getElementById("f");
const params = new URLSearchParams(location.search);
for (const [k, v] of params) if (form.elements[k]) form.elements[k].value = v;

async function load() {
  const q = new URLSearchParams(new FormData(form));
  const [data, breaks, summary] = await Promise.all([api("/api/activity?" + q), api("/api/breakages?days=" + q.get("days")), api("/api/summary")]);
  const repos = Object.values(summary.ci).map(c => c.repo);
  if (form.elements.repo.options.length === 1)
    form.elements.repo.innerHTML += repos.map(r => `<option value="${h(r)}">${h(repoName(r))}</option>`).join("");
  form.elements.repo.value = q.get("repo") || "";

  const open = breaks.filter(b => !b.fixed_sha);
  document.getElementById("breaks").innerHTML = open.length ? `<div class="box"><b class="bad">${open.length} CI check${open.length > 1 ? "s" : ""} broken on a default branch</b>
    <ul>${open.map(b => `<li><b>${h(b.check_name)}</b> in ${h(repoName(b.repo))}@${h(b.branch)} since ${commitLink(b.repo, b.broken_sha)}
    by <a href="/people#${encodeURIComponent(b.person || "")}">${h(b.person || "unknown")}</a>${b.pusher && b.pusher !== b.person ? `, pushed by ${h(b.pusher)}` : ""} (${when(b.broken_at)})</li>`).join("")}</ul></div>` : "";

  const pushes = document.getElementById("pushes");
  pushes.className = "";
  if (!data.pushes.length) pushes.innerHTML = '<p class="muted">No pushes recorded in this period yet. They arrive from GitHub webhooks and the Events API once the GitHub App is connected.</p>';
  else table(pushes, data.pushes, [
    {k: "pushed_at", label: "When", fmt: r => when(r.pushed_at)},
    {k: "pusher", label: "Pusher", fmt: r => `<a href="/people#${encodeURIComponent(r.pusher || "")}">${h(r.pusher)}</a>`},
    {k: "branch", label: "Where", fmt: r => `${h(repoName(r.repo))}@<b>${h(r.branch)}</b>${r.forced ? ' <span class="chip warn">force</span>' : ""}`},
    {k: "commits", label: "Commits", num: true, fmt: r => `<details><summary>${r.commits}</summary>${r.commit_list.map(c =>
      `<div>${commitLink(r.repo, c.sha)} ${h(c.person)}: ${h(c.message)} <span class="muted">+${c.additions} -${c.deletions}</span></div>`).join("")}</details>`},
    {k: "after", label: "CI on head", fmt: r => checkChips(r.checks) + r.broke.map(b => `<span class="chip bad">broke ${h(b)}</span>`).join("")},
    {k: "reviews", label: "Review", fmt: r => r.reviews.map(v => `<a href="/reviews#r${v.id}">${v.findings} findings</a>`).join(" ") || '<span class="muted">-</span>'},
  ], "pushed_at");

  table(document.getElementById("commits"), data.commits, [
    {k: "committed_at", label: "When", fmt: r => when(r.committed_at)},
    {k: "person", label: "Author", fmt: r => `<a href="/people#${encodeURIComponent(r.person)}">${h(r.person)}</a>`},
    {k: "repo", label: "Repo", cls: "hide-sm", fmt: r => h(repoName(r.repo)) + (r.on_default ? "" : ' <span class="muted">(branch)</span>')},
    {k: "sha", label: "Commit", fmt: r => commitLink(r.repo, r.sha)},
    {k: "message", label: "Message", fmt: r => h(r.message) + (r.is_merge ? ' <span class="chip">merge</span>' : "")},
    {k: "additions", label: "+", num: true}, {k: "deletions", label: "-", num: true},
  ], "committed_at");
}
form.onsubmit = e => { e.preventDefault(); history.replaceState(null, "", "?" + new URLSearchParams(new FormData(form))); load(); };
load().catch(e => document.getElementById("pushes").innerHTML = `<p class="error">${h(e.message)}</p>`);
</script>
</body></html>
