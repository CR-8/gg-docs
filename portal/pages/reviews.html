<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews</title><link rel="stylesheet" href="/static/style.css"></head>
<body><nav></nav>
<h1>Reviews</h1>
<p class="muted">The review bot reads only the diff of each PR (on open and every new push to it) and of direct pushes to
default branches. Each finding is blamed to the person who wrote that line.</p>
<form class="row" id="run" hidden>
  <select name="repo"></select><input name="pr" placeholder="PR number" size="10" inputmode="numeric">
  <button>Review this PR now</button><span id="run-msg" class="muted"></span>
</form>
<div id="list" class="muted">Loading...</div>
<div id="detail"></div>
<script type="module">
import {api, nav, h, when, short, repoName, commitLink, prLink, table} from "/static/app.js";
const me = await nav("/reviews");
const SEV = {critical: "bad", major: "warn", minor: "", nit: "muted"};

async function load() {
  const rows = await api("/api/reviews");
  const el = document.getElementById("list");
  el.className = "";
  if (!rows.length) { el.innerHTML = '<p class="muted">No reviews yet. They start once an LLM is set in Settings and a PR or push comes in.</p>'; return; }
  table(el, rows, [
    {k: "created_at", label: "When", fmt: r => when(r.created_at)},
    {k: "repo", label: "What", fmt: r => `${h(repoName(r.repo))} ${r.pr ? prLink(r.repo, r.pr) : "@" + h(r.branch)} <a href="#r${r.id}">${h(r.title)}</a>`},
    {k: "author", label: "Author", fmt: r => h(r.author || "")},
    {k: "findings", label: "Findings", num: true, fmt: r => `${r.findings}${r.critical ? ` <span class="chip bad">${r.critical} critical</span>` : ""}${r.major ? ` <span class="chip warn">${r.major} major</span>` : ""}`},
    {k: "slop", label: "Slop", num: true},
    {k: "posted_url", label: "On GitHub", fmt: r => r.posted_url ? `<a href="${h(r.posted_url)}" target="_blank" rel="noopener">posted</a>` : '<span class="muted">-</span>'},
  ], "created_at");
}

async function detail() {
  const m = location.hash.match(/^#r(\d+)$/);
  if (!m) return;
  const r = await api(`/api/reviews/${m[1]}`);
  const el = document.getElementById("detail");
  el.innerHTML = `<h2>${h(repoName(r.repo))} ${r.pr ? prLink(r.repo, r.pr) : "@" + h(r.branch)}: ${h(r.title)}</h2>
    <p class="muted">${commitLink(r.repo, r.base_sha)}..${commitLink(r.repo, r.head_sha)} &middot; ${h(r.model)} &middot; ${when(r.created_at)}</p>
    <div class="box"><p style="white-space:pre-wrap;margin:0">${h(r.summary)}</p></div><div id="findings"></div>`;
  table(document.getElementById("findings"), r.findings, [
    {k: "severity", label: "Severity", fmt: f => `<span class="${SEV[f.severity]}">${h(f.severity)}</span>`},
    {k: "category", label: "Category"},
    {k: "path", label: "Where", fmt: f => `<a href="https://github.com/${h(r.repo)}/blob/${h(r.head_sha)}/${h(f.path)}#L${f.line}" target="_blank" rel="noopener"><code>${h(f.path)}:${f.line}</code></a>`},
    {k: "title", label: "Finding", fmt: f => `<b>${h(f.title)}</b><div style="white-space:pre-wrap">${h(f.body)}</div>`},
    {k: "person", label: "Line by", fmt: f => `<a href="/people#${encodeURIComponent(f.person || "")}">${h(f.person || "")}</a>`},
  ], "severity", false);
  el.scrollIntoView({behavior: "smooth"});
}

if (me && me.admin) {
  const form = document.getElementById("run");
  const s = await api("/api/summary");
  form.elements.repo.innerHTML = Object.values(s.ci).map(c => `<option>${h(c.repo)}</option>`).join("");
  form.hidden = false;
  form.onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("run-msg");
    try { await api("/api/admin/review", {method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(form)))}); msg.textContent = "Queued; refresh in a minute."; }
    catch (err) { msg.textContent = err.message; }
  };
}
addEventListener("hashchange", detail);
load().then(detail).catch(e => document.getElementById("list").innerHTML = `<p class="error">${h(e.message)}</p>`);
</script>
</body></html>
