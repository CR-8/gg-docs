# gg portal on :7000, with its MongoDB.    docker compose up -d --build
# Optional parts are profiles, switched on with COMPOSE_PROFILES in .env (install.sh sets it):
#   https - Caddy serves https://DOMAIN with an automatic certificate
#   llm   - a local coder model (Ollama) the portal uses for reviews and the chatbot
#   ggops - GG-Ops on the same server, at https://GGOPS_DOMAIN (install.sh GGOPS_DIR=..., DEPLOY-GCP.md)
name: gg-portal
services:
  portal:
    build: .   # install.sh makes sure containers (and so build steps) can resolve names first
    env_file: .env
    environment:
      GITHUB_APP_PRIVATE_KEY_FILE: /secrets/github-app.pem
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/gg-docs}   # .env's MONGODB_URI (e.g. Atlas) wins
    volumes:
      - portal_data:/data
      - ./secrets:/secrets:ro
    ports: ["${BIND_ADDR:-0.0.0.0}:7000:7000"]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped

  # The portal's database (README 1.12): no published port, so only the portal reaches it. Unused (but harmless) when
  # MONGODB_URI points elsewhere. Back it up with mongodump (README 3.2.0).
  mongo:
    image: mongo:8.0
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Optional local model (profile "llm"): OpenAI-compatible API at http://llm:11434/v1, reachable only by the portal.
  llm:
    image: ollama/ollama:0.35.1
    profiles: [llm]
    environment:
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT:-16384}
      OLLAMA_KEEP_ALIVE: 24h        # keep the model in RAM between requests
      OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL:-1}   # 2 keeps a slot free for Ask; install.sh sets it from the RAM
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: ["${OLLAMA_DIR:-ollama}:/root/.ollama"]   # OLLAMA_DIR: a host Ollama's store, reused (install.sh)
    restart: unless-stopped

  # Optional GG-Ops (profile "ggops"): the Next.js app of a GG-ops checkout (GGOPS_DIR), built with its Dockerfile.
  # Its settings are that checkout's my-app/.env.production; install.sh checks the file is there.
  ggops:
    build: ${GGOPS_DIR:-../GG-ops}/my-app
    profiles: [ggops]
    env_file:
      - path: ${GGOPS_DIR:-../GG-ops}/my-app/.env.production
        required: false
    environment:
      AUTH_TRUST_HOST: "true"   # Auth.js behind Caddy: use the forwarded host
      # its public address, so Google sign-in returns there instead of to http(s)://localhost:3000
      AUTH_URL: https://${GGOPS_DOMAIN:-ggops.localhost}
    restart: unless-stopped

  # GG-Ops's one scheduled job, as vercel.json has it: recurring tasks, daily at 01:00 UTC, with its CRON_SECRET.
  ggops-cron:
    image: alpine:3.20
    profiles: [ggops]
    env_file:
      - path: ${GGOPS_DIR:-../GG-ops}/my-app/.env.production
        required: false
    command: ["sh", "-c", "echo \"0 1 * * * wget -q -O /dev/null --header 'Authorization: Bearer $$CRON_SECRET' http://ggops:3000/api/cron/recurring-tasks\" | crontab - && exec crond -f -l 6"]
    depends_on: [ggops]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-}
      GGOPS_DOMAIN: ${GGOPS_DOMAIN:-http://ggops.localhost}   # without GG-Ops: a plain-HTTP local name, no certificate
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [portal]
    restart: unless-stopped

volumes:
  portal_data:
  mongo_data:
  caddy_data:
  ollama:
